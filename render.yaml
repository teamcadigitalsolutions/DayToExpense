# Render Blueprint — DayToExpense (FastAPI + PostgreSQL + React Static Site)
version: "1"

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: daytoexpense-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: DayToExpense
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: daytoexpense-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://daytoexpense-frontend.onrender.com

  # ---------------------------------------------------------------------------
  # 2. React Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: daytoexpense-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ---------------------------------------------------------------------------
  # 3. Render Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: daytoexpense-postgres
    databaseName: daytodayexpenses
    user: daytoexpense_admin
    plan: free
